<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>Monitor de Avaliações Airbnb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mesmo sistema visual do painel da 1ª força-tarefa (Bluezone/Seazone), só tema claro.
   Layout: barra navy → abas (visão geral + 30 franquias) → indicadores → nota oficial no Airbnb
   → (franquia) quem pedir primeiro, imóveis em cartões, todos os check-outs. */
:root{
  --navy:#080E32; --azul-800:#193CB8; --azul:#0055FF; --azul-600:#1447E6; --azul-500:#2B7FFF;
  --tint:#F0F2FA; --canvas:#EAEEF6; --coral:#F1605D; --card-ink:#141A3C; --muted:#6B6E84;
  --border:#E6E7EA; --input:#F3F3F5; --white:#FFFFFF;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#C2410C; --warn-bg:#FFEDD5;
  --late:#B91C1C; --late-bg:#FEE2E2; --soon:#475569; --soon-bg:#F1F5F9;
  --g-colher:#0055FF; --g-pedir:#C2410C; --g-ref:#15803D;
  --el:0 1px 2px rgba(8,14,50,.08), 0 .1px .3px rgba(8,14,50,.06);
  --sans:"Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--sans);font-size:14px;line-height:1.5;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:.02em;text-wrap:balance;color:var(--navy)}
h1{font-size:30px} h2{font-size:17px}
p{margin:0}
button{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;
  padding:12px max(26px,env(safe-area-inset-right,0px)) 12px max(26px,env(safe-area-inset-left,0px))}
.top .marca{font-size:13px;font-weight:500;letter-spacing:.04em}
.top .tag{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px}
.top .stamp{margin-left:auto;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12px;color:rgba(255,255,255,.72)}
.top .stamp b{color:#fff;font-weight:500}
.wrap{max-width:1200px;margin:0 auto;padding:26px max(26px,env(safe-area-inset-right,0px)) 80px max(26px,env(safe-area-inset-left,0px))}

/* abas */
.abas{border:1px solid var(--border);border-radius:12px;background:var(--white);box-shadow:var(--el);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.abas .linha{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.abas .rot{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--c);min-width:150px}
.aba{background:var(--white);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:background .12s}
.aba:hover{background:var(--tint)}
.aba[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.aba.geral{font-weight:500}
.aba.geral[aria-selected="true"]{background:var(--navy);border-color:var(--navy)}
.abas.curta .linha.fr{display:none}
.recolher{background:none;border:0;padding:0;color:var(--azul);font-size:12px;font-weight:500;cursor:pointer;margin-left:auto}

/* cabeçalho de página */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-top:28px}
.head .sub{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--muted)}
.grp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--c);white-space:nowrap}
.grp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--el);min-width:0}
.kpi.hi{background:var(--tint);border-color:transparent;box-shadow:none}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.hi .l,.kpi.hi .h{color:var(--azul-800)} .kpi.hi .v{color:var(--azul)}
.kpi.ok .v{color:var(--ok)} .kpi.late .v{color:var(--late)} .kpi.soon .v{color:var(--soon)}

/* seções */
.sec{margin-top:36px}
.sec>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.hint{font-size:12px;color:var(--muted)}
.hint.push{margin-left:auto}

/* nota oficial: medidores */
.placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px}
.mv{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--el)}
.mv .l{font-size:12px;color:var(--muted)}
.mv .v{display:flex;align-items:baseline;gap:9px;margin:6px 0 10px}
.mv .de{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv .ar{color:var(--muted);font-size:13px}
.mv .ag{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dt{margin-left:auto;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--input);color:var(--muted);white-space:nowrap}
.dt.up{background:var(--ok-bg);color:var(--ok)} .dt.dn{background:var(--late-bg);color:var(--late)}
.bar{height:7px;border-radius:999px;background:var(--input);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b0{background:var(--azul-800)} .bar .bn{background:var(--ok)} .bar .bd{background:var(--coral)}
.mv .h{font-size:12px;color:var(--muted);margin-top:8px}
.mvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:12px}
.mvs>div{background:var(--white);padding:12px 14px}
.mvs .n{font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mvs .n.up{color:var(--ok)} .mvs .n.dn{color:var(--late)} .mvs .n.az{color:var(--azul)}
.mvs .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.zero{margin-top:12px;font-size:13px;color:var(--card-ink);max-width:110ch}
.zero b{font-weight:500}

/* cartões de hóspede */
.urg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hosp{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px 15px 12px;box-shadow:var(--el);display:flex;flex-direction:column;gap:9px}
.hosp .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hosp .nome{font-size:15px;font-weight:500;line-height:1.3}
.hosp .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:3px}
.hosp .meta .mono{color:var(--card-ink)}
.hosp .co{flex:none;text-align:center;background:var(--tint);border-radius:10px;padding:5px 9px 4px;min-width:62px}
.hosp .co .d{font-size:17px;font-weight:700;line-height:1.2;color:var(--azul-800);font-variant-numeric:tabular-nums}
.hosp .co .l{font-size:9.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--azul-800);opacity:.8}
.hosp .prazo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.hosp .prazo b{font-size:15px;font-weight:700;color:var(--warn)}
.hosp .prazo.d0 b{color:var(--late)}
.track{height:4px;border-radius:999px;background:var(--input);overflow:hidden}
.track i{display:block;height:100%;background:var(--warn);border-radius:999px}
.track.d0 i{background:var(--late)}
.mais{margin-top:12px}

/* cartões de imóvel */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{background:var(--white);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.im{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--el);display:flex;flex-direction:column}
.im.pronto{background:#F4FBF6;border-color:#CDEBD8;box-shadow:none}
.im.caiu{box-shadow:inset 3px 0 0 var(--coral),var(--el)}
.im .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.im .cod{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:0}
.im .np{display:flex;align-items:baseline;gap:5px}
.im .np .de{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.im .np .ar{color:var(--muted);font-size:12px}
.im .nota{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.im .nota.sem{font-size:13px;font-weight:500;color:var(--muted)}
.im .ped{font-size:12px;color:var(--muted);margin-top:2px}
.im .ped b{color:var(--warn);font-weight:700}
.im .alvo{display:flex;align-items:center;gap:11px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.im.pronto .alvo{border-top-color:#CDEBD8}
.im .alvo .n{font-size:30px;font-weight:700;line-height:1;color:var(--azul);font-variant-numeric:tabular-nums}
.im .alvo .n.z{color:var(--ok);font-size:22px}
.im .alvo .tx{font-size:12px;color:var(--muted);line-height:1.35}
.im .alvo .tx b{color:var(--card-ink);font-weight:500}
.im .pe{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:9px}
.im .pe .dl{font-weight:500;border-radius:999px;padding:1px 7px;background:var(--input);color:var(--muted);white-space:nowrap}
.im .pe .dl.up{background:var(--ok-bg);color:var(--ok)} .im .pe .dl.dn{background:var(--late-bg);color:var(--late)}
.im .hist{font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--white);box-shadow:var(--el)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--canvas);text-align:left;font-weight:500;font-size:11px;color:var(--muted);padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover{color:var(--navy)}
th[data-ord="asc"]::after{content:" ↑"} th[data-ord="desc"]::after{content:" ↓"}
tbody td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--tint)}
td.r,th.r{text-align:right}
td.nm{font-weight:500}
tr.clic{cursor:pointer}
tr.clic td.nm{color:var(--azul)}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-av{background:var(--ok-bg);color:var(--ok)} .b-ab{background:var(--warn-bg);color:var(--warn)}
.b-urg{background:var(--late-bg);color:var(--late)} .b-fec{background:var(--input);color:var(--muted)} .b-fut{background:var(--soon-bg);color:var(--soon)}
.rate{display:flex;align-items:center;gap:9px;min-width:120px}
.rate .t{flex:1;height:5px;border-radius:999px;background:var(--input);overflow:hidden}
.rate .t i{display:block;height:100%;background:var(--azul);border-radius:999px}
.rate span{font-size:12px;color:var(--muted);min-width:32px;text-align:right}
.delta{font-weight:500;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--input);color:var(--muted);white-space:nowrap}
.delta.up{background:var(--ok-bg);color:var(--ok)} .delta.dn{background:var(--late-bg);color:var(--late)}
.eq{color:var(--muted)}
.vazio{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}

/* rodapé */
.rules{margin-top:42px;padding-top:22px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:22px 34px}
.rules h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rules p,.rules li{font-size:13px;color:var(--card-ink);margin:0 0 6px;line-height:1.55}
.rules ul{margin:0;padding-left:18px}
@media (max-width:640px){
  .wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .stamp{margin-left:0}
  h1{font-size:24px}
  .abas .rot{min-width:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top">

</div>

</div>

const M = D.meta;
const G = {colher:{tag:"Prioridade agora",c:"var(--g-colher)"},pedir:{tag:"Precisam pedir mais",c:"var(--g-pedir)"},ref:{tag:"Exemplos a seguir",c:"var(--g-ref)"}};
const ORD = ["colher","pedir","ref"];
const META = 4.80, DIF = 0.005, URG = 3, DIA = 864e5;
const br = new Intl.NumberFormat("pt-BR");
const n2 = v => v==null ? "–" : v.toFixed(2).replace(".",",");
const pc = v => Math.round(v*100)+"%";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dm = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "–";
const dt = s => new Date(s+"T12:00:00");
const HOJE = dt(M.hoje);
const addD = (s,n) => new Date(dt(s).getTime()+n*DIA).toISOString().slice(0,10);
const sinal = (d,f=n2) => d==null ? "–" : Math.abs(d)<DIF ? "0,00" : (d>0?"+":"−")+f(Math.abs(d));
const cls = d => d==null||Math.abs(d)<DIF ? "" : d>0 ? "up" : "dn";
const k5 = (n,a) => n==null||a==null ? null : n>=META-1e-9 ? 0 : Math.ceil(a*(META-n)/(5-META)-1e-9);
const MZ = dm(M.marco);

/* situação de cada check-out */
for (const r of D.res){
  r.lim = addD(r.ck,14);
  if (r.rd) r.s="av";
  else if (dt(r.ck) > HOJE) r.s="fut";
  else if (dt(r.lim) >= HOJE){ r.s = "ab"; r.dias = Math.round((dt(r.lim)-HOJE)/DIA); }
  else r.s="fec";
}

/* imóvel: marco zero (05/10, reconstruído) → leitura mais recente do anúncio */
function imovel(code, res){
  const h=(D.notas[code]||[]).filter(e=>e.nota!=null);
  const ult=(D.notas[code]||[]).slice(-1)[0];
  const at=h.length?h[h.length-1]:null, z=D.mz[code]||null;
  const rs=res.filter(r=>r.listing===code);
  const o={code,h,at:at?at.nota:null,av:at?at.aval:null,z:z?z.nota:null,zav:z?z.aval:null,
    erro:at?null:(ult&&ult.erro)||"sem leitura",
    ck:rs.length,avd:rs.filter(r=>r.s==="av").length,abt:rs.filter(r=>r.s==="ab").length,
    urg:rs.filter(r=>r.s==="ab"&&r.dias<=URG).length,fut:rs.filter(r=>r.s==="fut").length};
  o.d=(o.at!=null&&o.z!=null)?o.at-o.z:null;
  o.novas=(o.av!=null&&o.zav!=null)?o.av-o.zav:null;
  o.k=k5(o.at,o.av); o.kz=k5(o.z,o.zav);
  return o;
}
/* agregado de nota: sempre sobre o MESMO conjunto de imóveis (tem marco zero e leitura de hoje) */
function notaAgg(ims){
  const c=ims.filter(x=>x.at!=null&&x.z!=null);
  const m=k=>c.length?c.reduce((a,x)=>a+x[k],0)/c.length:null;
  return {n:c.length,lidos:ims.filter(x=>x.at!=null).length,tot:ims.length,
    z:m("z"),at:m("at"),
    z480:c.filter(x=>x.z>=META-1e-9).length, at480:c.filter(x=>x.at>=META-1e-9).length,
    zav:c.reduce((a,x)=>a+x.zav,0), av:c.reduce((a,x)=>a+x.av,0),
    sub:c.filter(x=>x.d>=DIF).length, cai:c.filter(x=>x.d<=-DIF).length, igual:c.filter(x=>Math.abs(x.d)<DIF).length,
    cruz:c.filter(x=>x.z<META-1e-9&&x.at>=META-1e-9).length,
    kz:c.reduce((a,x)=>a+x.kz,0), k:c.reduce((a,x)=>a+x.k,0)};
}
function agg(res){
  const cnt=s=>res.filter(r=>r.s===s).length, pass=res.filter(r=>r.s!=="fut").length;
  return {av:cnt("av"),ab:cnt("ab"),fec:cnt("fec"),fut:cnt("fut"),pass,tx:pass?cnt("av")/pass:0,
    urg:res.filter(r=>r.s==="ab"&&r.dias<=URG).length};
}
const FR = D.fr.map(f=>{
  const res=D.res.filter(r=>r.fc===f.c);
  const ims=[...new Set(res.map(r=>r.listing))].sort().map(c=>imovel(c,res));
  return {...f,res,ims,...agg(res),N:notaAgg(ims)};
});
const byC=Object.fromEntries(FR.map(f=>[f.c,f]));
const TODOS={res:D.res,ims:FR.flatMap(f=>f.ims)};
Object.assign(TODOS,agg(TODOS.res),{N:notaAgg(TODOS.ims)});

/* carimbo e abas */
document.getElementById("carimbo").innerHTML =
  `<span>Atualizado em <b>${dm(M.hoje)}</b></span><span>avaliações apuradas até <b>${dm(M.revs_ate)}</b></span><span>nota dos anúncios lida em <b>${dm(M.notas_em)}</b></span>`;
const abas=document.getElementById("abas");
abas.innerHTML = `<div class="linha"><button type="button" class="aba geral" data-c="geral">Visão geral</button><button type="button" class="recolher" id="recolher" aria-expanded="true">Recolher franquias</button></div>` +
  ORD.map(g=>`<div class="linha fr"><span class="rot" style="--c:${G[g].c}">${G[g].tag}</span>${FR.filter(f=>f.g===g).map(f=>`<button type="button" class="aba" data-c="${f.c}">${esc(f.curto)}</button>`).join("")}</div>`).join("");
abas.addEventListener("click",e=>{const b=e.target.closest(".aba"); if(b) abrir(b.dataset.c);});
document.getElementById("recolher").addEventListener("click",e=>{const c=abas.classList.toggle("curta"); e.target.textContent=c?"Mostrar franquias":"Recolher franquias"; e.target.setAttribute("aria-expanded",String(!c));});

/* tabela ordenável */
function tabela(el, cols, linhas, ordIni){
  let k=ordIni[0], dir=ordIni[1];
  function draw(){
    const L=[...linhas].sort((a,b)=>{const x=a[k],y=b[k]; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x<y?-1:x>y?1:0)*(dir==="asc"?1:-1);});
    el.innerHTML=`<table><thead><tr>${cols.map(c=>`<th class="${c.r?"r":""}" ${c.k?`data-k="${c.k}" tabindex="0" ${c.k===k?`data-ord="${dir}"`:""}`:""}>${c.t}</th>`).join("")}</tr></thead><tbody>${L.map(r=>`<tr${r._clic?` class="clic" tabindex="0" data-c="${r._clic}"`:""}>${cols.map(c=>`<td class="${c.r?"r":""} ${c.cls||""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  el.onclick=e=>{const th=e.target.closest("th[data-k]"); if(th){ if(k===th.dataset.k) dir=dir==="asc"?"desc":"asc"; else {k=th.dataset.k; dir=["n","gi","listing","client_name","code","ck","lim","dias"].includes(k)?"asc":"desc";} draw(); return;}
    const tr=e.target.closest("tr.clic"); if(tr) abrir(tr.dataset.c);};
  el.onkeydown=e=>{if(e.key!=="Enter")return; const th=e.target.closest("th[data-k]"); if(th) th.click(); const tr=e.target.closest("tr.clic"); if(tr) abrir(tr.dataset.c);};
  draw();
}

const kpi=(l,v,h,c="")=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="h">${h}</div></div>`;
function indicadores(A){
  return `<div class="kpis">
    ${kpi("Podem avaliar agora",br.format(A.ab),"já saíram e estão no prazo","hi")}
    ${kpi(`Prazo acaba em até ${URG} dias`,br.format(A.urg),"peça a esses primeiro",A.urg?"late":"")}
    ${kpi("Já avaliaram",pc(A.tx),`${br.format(A.av)} de ${br.format(A.pass)} check-outs de outubro`,"ok")}
    ${kpi("Ainda vão sair",br.format(A.fut),"check-out até 31/10","soon")}
    ${kpi("Avaliações novas no anúncio",(A.N.av-A.N.zav>0?"+":"")+br.format(A.N.av-A.N.zav),`desde ${MZ}, início da task force`)}
  </div>`;
}

/* bloco "Nota oficial no Airbnb" */
function barra(a,b,lo,hi){
  const p=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  if (a==null||b==null) return '<div class="bar"></div>';
  return b>=a ? `<div class="bar"><i class="b0" style="width:${p(a)}%"></i><i class="bn" style="width:${p(b)-p(a)}%"></i></div>`
              : `<div class="bar"><i class="b0" style="width:${p(b)}%"></i><i class="bd" style="width:${p(a)-p(b)}%"></i></div>`;
}
function notaOficial(N, quem){
  if (!N.n) return `<section class="sec"><header><h2>Nota oficial no Airbnb</h2></header><p class="vazio">Nenhum anúncio lido ainda.</p></section>`;
  const dN=N.at-N.z, dA=N.av-N.zav, d48=N.at480-N.z480;
  const frase = `Em ${MZ}, quando a task force começou, a nota média ${quem} era <b>${n2(N.z)}</b> e <b>${N.z480}</b> ${N.z480===1?"imóvel estava":"imóveis estavam"} em 4,80 ou mais. `+
    `Hoje, lida direto no anúncio, a média é <b>${n2(N.at)}</b> e <b>${N.at480}</b> ${N.at480===1?"está":"estão"} na meta. `+
    `Desde então entraram <b>${br.format(dA)}</b> avaliações novas nesses anúncios: <b>${N.sub}</b> ${N.sub===1?"imóvel subiu":"imóveis subiram"} de nota e <b>${N.cai}</b> ${N.cai===1?"caiu":"caíram"}. `+
    `As notas 5 que faltam para todos chegarem a 4,80 foram de <b>${br.format(N.kz)}</b> para <b>${br.format(N.k)}</b>.`;
  return `<section class="sec">
    <header><h2>Nota oficial no Airbnb</h2><span class="hint push">início da task force ${MZ} → anúncio em ${dm(M.notas_em)}</span></header>
    <div class="placar">
      <div class="mv"><div class="l">Nota média dos imóveis</div>
        <div class="v"><span class="de">${n2(N.z)}</span><span class="ar">→</span><span class="ag">${n2(N.at)}</span><span class="dt ${cls(dN)}">${sinal(dN)}</span></div>
        ${barra(N.z,N.at,4,5)}<div class="h">escala de 4,00 a 5,00 · média simples de ${br.format(N.n)} anúncios</div></div>
      <div class="mv"><div class="l">Imóveis em 4,80 ou mais</div>
        <div class="v"><span class="de">${N.z480}</span><span class="ar">→</span><span class="ag">${N.at480}</span><span class="dt ${cls(d48)}">${d48>0?"+":d48<0?"−":""}${Math.abs(d48)}</span></div>
        ${barra(N.z480/N.n,N.at480/N.n,0,1)}<div class="h">${pc(N.at480/N.n)} dos anúncios lidos já estão na meta</div></div>
      <div class="mv"><div class="l">Avaliações no anúncio</div>
        <div class="v"><span class="de">${br.format(N.zav)}</span><span class="ar">→</span><span class="ag">${br.format(N.av)}</span><span class="dt ${dA>0?"up":""}">${dA>0?"+":""}${br.format(dA)}</span></div>
        ${barra(N.zav,N.av,0,Math.max(N.av,1))}<div class="h">${br.format(dA)} avaliações novas desde ${MZ}</div></div>
    </div>
    <div class="mvs">
      <div><div class="n up">${N.sub}</div><div class="l">imóveis subiram de nota</div></div>
      <div><div class="n dn">${N.cai}</div><div class="l">caíram de nota</div></div>
      <div><div class="n">${N.igual}</div><div class="l">sem mudança</div></div>
      <div><div class="n az">${N.cruz}</div><div class="l">cruzaram os 4,80</div></div>
      <div><div class="n">${br.format(N.k)}</div><div class="l">notas 5 que faltam para todos chegarem a 4,80 (eram ${br.format(N.kz)})</div></div>
    </div>
    <p class="zero">${frase}${N.lidos<N.tot?` ${N.tot-N.lidos} ${N.tot-N.lidos===1?"anúncio não pôde ser lido":"anúncios não puderam ser lidos"} e ${N.tot-N.lidos===1?"fica":"ficam"} de fora da média.`:""}</p>
  </section>`;
}

    {t:"Grupo",k:"gi",f:r=>`<span class="grp" style="--c:${G[r.g].c}">${G[r.g].tag}</span>`},
    {t:"Imóveis",k:"nimv",r:1,f:r=>r.nimv},
    {t:"Podem avaliar",k:"ab",r:1,f:r=>`<b>${r.ab}</b>`},
    {t:`Até ${URG} dias`,k:"urg",r:1,f:r=>r.urg?`<b style="color:var(--late)">${r.urg}</b>`:'<span class="eq">0</span>'},
    {t:"Já avaliaram",k:"tx",f:r=>`<div class="rate"><div class="t"><i style="width:${Math.round(r.tx*100)}%"></i></div><span>${pc(r.tx)}</span></div>`},
    {t:`Novas desde ${MZ}`,k:"novas",r:1,f:r=>r.novas>0?`<span style="color:var(--ok)">+${r.novas}</span>`:'<span class="eq">0</span>'},
    {t:`Nota ${MZ} → hoje`,k:"nat",r:1,f:r=>`${n2(r.nz)} → <b>${n2(r.nat)}</b>`},
    {t:"Variação",k:"dn",r:1,f:r=>`<span class="delta ${cls(r.dn)}">${sinal(r.dn)}</span>`},
    {t:"Em 4,80+",k:"m48",r:1,f:r=>`${r.N.z480} → <b>${r.N.at480}</b> <span class="eq">de ${r.N.n}</span>`},
    {t:"Notas 5 que faltam",k:"k",r:1,f:r=>br.format(r.k)}
  ],L,["ab","desc"]);
}

function cardHosp(r){
  const pct=Math.max(6,Math.round((r.dias+1)/15*100));
  return `<div class="hosp"><div class="cab"><div><div class="nome">${r.client_name?esc(r.client_name):'<span class="eq">sem nome no Sapron</span>'}</div>
    <div class="meta"><span class="mono">${esc(r.listing)}</span><span>entrou ${dm(r.ci)}</span></div></div>
    <div class="co"><div class="d">${dm(r.ck)}</div><div class="l">check-out</div></div></div>
    <div class="prazo ${r.dias===0?"d0":""}"><span>pode avaliar até ${dm(r.lim)}</span><span><b>${r.dias===0?"último dia":r.dias+(r.dias===1?" dia":" dias")}</b></span></div>
    <div class="track ${r.dias===0?"d0":""}"><i style="width:${pct}%"></i></div></div>`;
}
function cardIm(x){
  const pronto=x.at!=null&&x.at>=META-1e-9, caiu=x.d!=null&&x.d<=-DIF;
  const topo = x.at==null ? `<span class="nota sem" title="${esc(x.erro)}">${x.erro==="anúncio ainda sem avaliações"?"sem avaliações ainda":"sem leitura"}</span>`
    : `<div class="np">${x.z!=null&&Math.abs(x.d)>=DIF?`<span class="de">${n2(x.z)}</span><span class="ar">→</span>`:""}<span class="nota">${n2(x.at)}</span></div>`;
  const alvo = x.at==null ? "" : pronto
    ? `<div class="alvo"><span class="n z">4,80</span><span class="tx">${x.z!=null&&x.z<META-1e-9?"<b>cruzou a meta</b> desde "+MZ:"na meta de 4,80 — agora é manter"}</span></div>`
    : `<div class="alvo"><span class="n">${x.k}</span><span class="tx">${x.k===1?"nota 5":"notas 5"} para chegar a <b>4,80</b>${x.kz!=null&&x.kz!==x.k?`<br>eram ${x.kz} em ${MZ}`:""}</span></div>`;
  const ped = x.abt ? `<div class="ped"><b>${x.abt}</b> ${x.abt===1?"hóspede pode":"hóspedes podem"} avaliar${x.urg?` · ${x.urg} até ${URG} dias`:""}</div>`
    : `<div class="ped">${x.fut?`${x.fut} check-out${x.fut===1?"":"s"} ainda por vir`:"ninguém no prazo agora"}</div>`;
  const hist = x.h.length>1 ? `<div class="hist">leituras: ${x.h.map(e=>`${dm(e.data)} ${n2(e.nota)}`).join(" · ")}</div>` : "";
  return `<div class="im ${pronto?"pronto":""} ${caiu?"caiu":""}"><div class="t"><span class="cod">${esc(x.code)}</span>${topo}</div>${ped}${alvo}
    ${x.at!=null?`<div class="pe"><span>${br.format(x.av)} avaliações${x.novas>0?` <span style="color:var(--ok)">+${x.novas}</span>`:""}</span><span class="dl ${cls(x.d)}">${x.d==null?"sem marco zero":Math.abs(x.d)<DIF?"nota mantida":sinal(x.d)+" de nota"}</span></div>`:""}${hist}</div>`;
}

function franquia(c){
  const f=byC[c];
  const ab=f.res.filter(r=>r.s==="ab").sort((a,b)=>a.dias-b.dias||a.listing.localeCompare(b.listing));
  const urg=ab.filter(r=>r.dias<=URG);
  pag.innerHTML=`
  <div class="head"><div><span class="grp" style="--c:${G[f.g].c}">${G[f.g].tag}</span><h1 style="margin-top:8px">${esc(f.n)}</h1>
    <div class="sub"><span class="mono">${esc(f.c)}</span><span>${f.ims.length} imóveis</span><span>${f.res.length} check-outs Airbnb em outubro</span></div></div>
    <button type="button" class="chip" id="voltar">← Visão geral</button></div>
  ${indicadores(f)}
  ${notaOficial(f.N,"dos imóveis da franquia")}
  <section class="sec">
    <header><h2>Peça primeiro</h2><span class="hint push">prazo do Airbnb acaba em até ${URG} dias</span></header>
    ${urg.length?`<div class="urg">${urg.map(cardHosp).join("")}</div>`:`<p class="vazio">Nenhum hóspede com prazo acabando nos próximos ${URG} dias.</p>`}
  </section>
  <section class="sec">
    <header><h2>Seus imóveis</h2><span class="hint push">nota em ${MZ} → nota no anúncio hoje</span></header>
    <div class="tools" id="ordIm">
      <button type="button" class="chip" data-o="perto" aria-pressed="true">Mais perto de 4,80</button>
      <button type="button" class="chip" data-o="ped" aria-pressed="false">Mais hóspedes para pedir</button>
      <button type="button" class="chip" data-o="var" aria-pressed="false">Maior variação</button>
    </div>
    <div class="imgrid" id="g-im"></div>
  </section>
  <section class="sec">
    <header><h2>Todos os check-outs de outubro</h2></header>
    <div class="tools" id="fx">
      <button type="button" class="chip" data-s="" aria-pressed="true">Todos <span class="n">${f.res.length}</span></button>
      <button type="button" class="chip" data-s="ab" aria-pressed="false">Podem avaliar <span class="n">${f.ab}</span></button>
      <button type="button" class="chip" data-s="av" aria-pressed="false">Já avaliaram <span class="n">${f.av}</span></button>
      <button type="button" class="chip" data-s="fec" aria-pressed="false">Prazo encerrado <span class="n">${f.fec}</span></button>
      <button type="button" class="chip" data-s="fut" aria-pressed="false">Ainda vão sair <span class="n">${f.fut}</span></button>
    </div>
    <div class="tablewrap" id="t-res"></div>
  </section>`;
  document.getElementById("voltar").onclick=()=>abrir("geral");

  const ORDS={
    perto:(a,b)=>(a.at==null)-(b.at==null)||(b.at>=META-1e-9)-(a.at>=META-1e-9)||(a.k??1e9)-(b.k??1e9)||b.abt-a.abt,
    ped:(a,b)=>b.abt-a.abt||b.urg-a.urg||(a.k??1e9)-(b.k??1e9),
    var:(a,b)=>Math.abs(b.d??0)-Math.abs(a.d??0)||(a.k??1e9)-(b.k??1e9)};
  const gIm=document.getElementById("g-im");
  const desIm=o=>{gIm.innerHTML=[...f.ims].sort(ORDS[o]).map(cardIm).join("");};
  document.getElementById("ordIm").onclick=e=>{const b=e.target.closest("button"); if(!b)return;
    document.querySelectorAll("#ordIm button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); desIm(b.dataset.o);};
  desIm("perto");

  const nomeH=r=>r.client_name?esc(r.client_name):'<span class="eq">sem nome no Sapron</span>';
  const sit=r=>r.s==="av"?`<span class="badge b-av">Avaliou${r.nota?" · nota "+esc(String(r.nota).replace(".0","")):""}</span>`
    : r.s==="ab"?`<span class="badge ${r.dias<=URG?"b-urg":"b-ab"}">${r.dias===0?"Último dia":"Faltam "+r.dias+(r.dias===1?" dia":" dias")}</span>`
    : r.s==="fut"?'<span class="badge b-fut">Ainda vai sair</span>':'<span class="badge b-fec">Prazo encerrado</span>';
  let filtro="";
  const ordS={ab:0,fut:1,av:2,fec:3};
  const tRes=document.getElementById("t-res");
  const desRes=()=>tabela(tRes,[
    {t:"Hóspede",k:"client_name",cls:"nm",f:nomeH},
    {t:"Imóvel",k:"listing",f:r=>`<span class="mono">${esc(r.listing)}</span>`},
    {t:"Entrada",k:"ci",f:r=>dm(r.ci)},
    {t:"Check-out",k:"ck",f:r=>dm(r.ck)},
    {t:"Pode avaliar até",k:"lim",f:r=>dm(r.lim)},
    {t:"Situação",k:"so",f:sit}
  ],f.res.filter(r=>!filtro||r.s===filtro).map(r=>({...r,so:ordS[r.s]*100+(r.dias??0)})),["so","asc"]);
  document.getElementById("fx").onclick=e=>{const b=e.target.closest("button"); if(!b)return; filtro=b.dataset.s;
    document.querySelectorAll("#fx button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); desRes();};
  desRes();
}

document.getElementById("regras").innerHTML=`
  <div><h3>Como a página se atualiza</h3>
    <p>A operação reprocessa o quadro quando precisa e republica a página. A data da última atualização fica no topo.</p>
    <p>As avaliações do Airbnb chegam à base da Seazone com alguns dias de atraso. Por isso o selo "apuradas até ${dm(M.revs_ate)}": tudo o que a página mostra vale até essa data.</p></div>
  <div><h3>De onde vêm os números</h3><ul>
    <li>A nota e o total de avaliações são lidos na própria página de cada anúncio no Airbnb. É o número oficial, não uma estimativa. Cada leitura fica guardada no histórico.</li>
    <li>A nota de ${MZ}, início da task force, foi reconstruída: parte da primeira leitura do anúncio e desconta as avaliações publicadas desde ${MZ}. Esse marco fica congelado.</li>
    <li>"Notas 5 que faltam" é quanto o imóvel precisa para a média chegar a 4,80. Cai a cada nota alta e sobe quando entra nota baixa.</li>
    <li>As médias comparam sempre os mesmos anúncios nas duas datas.</li></ul></div>
  <div><h3>O que o Airbnb permite</h3><ul>
    <li>O hóspede tem 14 dias após o check-out para avaliar. Passou o prazo, a avaliação não entra mais.</li>
    <li>Pedir avaliação é permitido. Oferecer desconto, brinde ou qualquer troca pelo pedido, não.</li>
    <li>Se a estadia teve um problema que ficou sem solução, não peça avaliação a esse hóspede.</li></ul></div>
  <div><h3>Quem entra na lista</h3><ul>
    <li>Check-outs de reservas do Airbnb de 01 a 31/10 nos imóveis das 30 franquias da task force. Reserva de outro canal não gera nota na plataforma.</li>
    <li>"Já avaliaram" casa a reserva do Sapron com a avaliação do Airbnb pelo imóvel e pelo primeiro e último nome do hóspede.</li></ul></div>`;

function abrir(c){
  if (c!=="geral" && !byC[c]) c="geral";
  document.querySelectorAll(".aba").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.c===c)));
  if (c==="geral") geral(); else franquia(c);
  try{ history.replaceState(null,"","#"+c); }catch(e){}
  try{ localStorage.setItem("monitor:aba",c); }catch(e){}
  window.scrollTo(0,0);
}
let ini="geral";
const hs=location.hash.slice(1);
if (hs) ini=hs; else { try{ ini=localStorage.getItem("monitor:aba")||"geral"; }catch(e){} }
abrir(ini);
</script>
</body></html>
